name: draw keymap

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/doc.yml"
      - "keymap_img/keymap_drawer.config.yaml"
      - "config/*.keymap"
      - "config/*.dtsi"

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install keymap-drawer
        run: pip install keymap-drawer

      - name: Parse keymap
        run: |
          mkdir -p keymap_img
          keymap -c keymap_img/keymap_drawer.config.yaml parse \
            -c 12 \
            -z config/corne.keymap \
            > keymap_img/corne.yaml

      - name: Draw combined (all layers)
        run: |
          keymap -c keymap_img/keymap_drawer.config.yaml draw \
            keymap_img/corne.yaml \
            -k corne_rotated \
            -s default_layer colemak_layer num_nav_layer fun_layer game_layer \
            > keymap_img/corne.svg

      - name: Draw per-layer SVGs
        run: |
          for layer in default_layer num_nav_layer fun_layer game_layer colemak_layer; do
            keymap -c keymap_img/keymap_drawer.config.yaml draw \
              keymap_img/corne.yaml \
              -k corne_rotated \
              -s "$layer" \
              > "keymap_img/corne_${layer}.svg"
          done

      - name: Commit images
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keymap_img/*.svg keymap_img/*.yaml
          if ! git diff --cached --quiet; then
            git commit -m "doc: update keymap images"
            git push
          fi
